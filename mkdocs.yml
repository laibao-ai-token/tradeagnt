site_name: tradeagnt
site_description: Standalone terminal trading assistant (monolith tradecat package)
site_author: tradeagnt

repo_url: https://github.com/laibao-ai-token/tradeagnt
repo_name: laibao-ai-token/tradeagnt
edit_uri: edit/tradecat/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top

nav:
  - Home: index.md
  - Standalone: STANDALONE.md
  - Freeze scope: FREEZE_SCOPE.md
  - Migration: MIGRATE_v0.8_to_v1.0.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
