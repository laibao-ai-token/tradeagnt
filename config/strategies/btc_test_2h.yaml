name: btc_test_2h
market: crypto
symbols:
- BTCUSDT
timeframe: 1h
indicators:
- name: rsi
  params:
    period: 14
- name: macd
  params:
    fast: 12
    slow: 26
    signal: 9
- name: ema
  params:
    fast: 7
    medium: 25
    slow: 99
rules:
- name: RSI 超卖做多
  category: momentum
  subcategory: rsi
  direction: BUY
  strength: 80
  priority: high
  cooldown: 7200
  min_volume: 100
  condition:
    type: threshold_cross_up
    field: rsi
    threshold: 30
  message_template: RSI 从超卖区回升，做多信号
- name: EMA 突破做多
  category: trend
  subcategory: ema
  direction: BUY
  strength: 70
  priority: medium
  cooldown: 7200
  min_volume: 100
  condition:
    type: cross_up
    field_a: close
    field_b: ema_slow
  message_template: 价格突破 EMA99，趋势转多
- name: RSI 超买做空
  category: momentum
  subcategory: rsi
  direction: SELL
  strength: 80
  priority: high
  cooldown: 7200
  min_volume: 100
  condition:
    type: threshold_cross_down
    field: rsi
    threshold: 70
  message_template: RSI 从超买区回落，做空信号
thresholds: {}
weights: {}
