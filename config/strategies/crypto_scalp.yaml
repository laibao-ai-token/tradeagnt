name: "Crypto Scalp"
market: crypto
symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
timeframe: 1h

indicators:
  - name: rsi
    params:
      period: 14
  - name: macd
    params:
      fast: 12
      slow: 26
      signal: 9
  - name: kdj
    params:
      n: 9
      m1: 3
      m2: 3
  - name: ema
    params:
      fast: 7
      medium: 25
      slow: 99
  - name: bollinger
    params:
      period: 20
      std_dev: 2.0
  - name: atr
    params:
      period: 14
  - name: volume_ratio
    params:
      period: 20
  - name: obv
  - name: super_trend
    params:
      length: 70
      mult: 1.2
  - name: k_pattern
  - name: support_resistance
    params:
      window: 20

rules:
  # === Momentum (8) ===
  - name: RSI超买区卖出
    category: momentum
    subcategory: rsi
    direction: SELL
    strength: 60
    priority: medium
    cooldown: 3600
    condition:
      type: threshold_cross_up
      field: rsi
      threshold: 70
    message_template: "RSI进入超买区: {rsi:.1f}"
    fields:
      rsi: rsi

  - name: RSI超卖区买入
    category: momentum
    subcategory: rsi
    direction: BUY
    strength: 60
    priority: medium
    cooldown: 3600
    condition:
      type: threshold_cross_down
      field: rsi
      threshold: 30
    message_template: "RSI进入超卖区: {rsi:.1f}"
    fields:
      rsi: rsi

  - name: RSI回落卖出
    category: momentum
    subcategory: rsi
    direction: SELL
    strength: 70
    priority: high
    cooldown: 7200
    condition:
      type: threshold_cross_down
      field: rsi
      threshold: 70
    message_template: "RSI从超买区回落: {rsi:.1f}"
    fields:
      rsi: rsi

  - name: RSI回升买入
    category: momentum
    subcategory: rsi
    direction: BUY
    strength: 70
    priority: high
    cooldown: 7200
    condition:
      type: threshold_cross_up
      field: rsi
      threshold: 30
    message_template: "RSI从超卖区回升: {rsi:.1f}"
    fields:
      rsi: rsi

  - name: MACD金叉买入
    category: momentum
    subcategory: macd
    direction: BUY
    strength: 75
    priority: high
    cooldown: 3600
    condition:
      type: cross_up
      field_a: macd_dif
      field_b: macd_dea
    message_template: "MACD金叉 DIF={d:.4f} DEA={dea:.4f}"
    fields:
      d: macd_dif
      dea: macd_dea

  - name: MACD死叉卖出
    category: momentum
    subcategory: macd
    direction: SELL
    strength: 75
    priority: high
    cooldown: 3600
    condition:
      type: cross_down
      field_a: macd_dif
      field_b: macd_dea
    message_template: "MACD死叉 DIF={d:.4f} DEA={dea:.4f}"
    fields:
      d: macd_dif
      dea: macd_dea

  - name: MACD柱状转正
    category: momentum
    subcategory: macd
    direction: BUY
    strength: 65
    priority: medium
    cooldown: 3600
    condition:
      type: threshold_cross_up
      field: macd_hist
      threshold: 0
    message_template: "MACD柱状转正: {hist:.4f}"
    fields:
      hist: macd_hist

  - name: MACD柱状转负
    category: momentum
    subcategory: macd
    direction: SELL
    strength: 65
    priority: medium
    cooldown: 3600
    condition:
      type: threshold_cross_down
      field: macd_hist
      threshold: 0
    message_template: "MACD柱状转负: {hist:.4f}"
    fields:
      hist: macd_hist

  # === Trend (6) ===
  - name: EMA趋势转多
    category: trend
    subcategory: ema
    direction: BUY
    strength: 75
    priority: high
    cooldown: 7200
    condition:
      type: state_change
      field: ema_trend
      from_values:
        - "bearish"
        - "neutral"
      to_values:
        - "bullish"
    message_template: "EMA趋势转多"

  - name: EMA趋势转空
    category: trend
    subcategory: ema
    direction: SELL
    strength: 75
    priority: high
    cooldown: 7200
    condition:
      type: state_change
      field: ema_trend
      from_values:
        - "bullish"
        - "neutral"
      to_values:
        - "bearish"
    message_template: "EMA趋势转空"

  - name: 价格上穿EMA7
    category: trend
    subcategory: price_ema
    direction: BUY
    strength: 60
    priority: medium
    cooldown: 3600
    condition:
      type: cross_up
      field_a: close
      field_b: ema_fast
    message_template: "价格上穿EMA7 收盘:{price:.2f}"
    fields:
      price: close

  - name: 价格下穿EMA7
    category: trend
    subcategory: price_ema
    direction: SELL
    strength: 60
    priority: medium
    cooldown: 3600
    condition:
      type: cross_down
      field_a: close
      field_b: ema_fast
    message_template: "价格下穿EMA7 收盘:{price:.2f}"
    fields:
      price: close

  - name: SuperTrend翻多
    category: trend
    subcategory: supertrend
    direction: BUY
    strength: 70
    priority: high
    cooldown: 7200
    condition:
      type: state_change
      field: super_trend_direction
      from_values:
        - "down"
        - "neutral"
      to_values:
        - "up"
    message_template: "SuperTrend翻多"

  - name: SuperTrend翻空
    category: trend
    subcategory: supertrend
    direction: SELL
    strength: 70
    priority: high
    cooldown: 7200
    condition:
      type: state_change
      field: super_trend_direction
      from_values:
        - "up"
        - "neutral"
      to_values:
        - "down"
    message_template: "SuperTrend翻空"

  - name: KDJ金叉买入
    category: momentum
    subcategory: kdj
    direction: BUY
    strength: 70
    priority: high
    cooldown: 3600
    condition:
      type: cross_up
      field_a: kdj_k
      field_b: kdj_d
    message_template: "KDJ金叉"

  - name: KDJ死叉卖出
    category: momentum
    subcategory: kdj
    direction: SELL
    strength: 70
    priority: high
    cooldown: 3600
    condition:
      type: cross_down
      field_a: kdj_k
      field_b: kdj_d
    message_template: "KDJ死叉"

  - name: 价格上穿BB中轨
    category: volatility
    subcategory: bollinger
    direction: ALERT
    strength: 50
    priority: low
    cooldown: 3600
    condition:
      type: cross_up
      field_a: close
      field_b: bb_middle
    message_template: "价格上穿BB中轨"

  - name: 价格下穿BB中轨
    category: volatility
    subcategory: bollinger
    direction: ALERT
    strength: 50
    priority: low
    cooldown: 3600
    condition:
      type: cross_down
      field_a: close
      field_b: bb_middle
    message_template: "价格下穿BB中轨"

  # === Volatility (1) ===
  - name: ATR异常放大
    category: volatility
    subcategory: atr
    direction: ALERT
    strength: 50
    priority: low
    cooldown: 3600
    condition:
      type: threshold_cross_up
      field: atr
      threshold: 5.0
    message_template: "ATR异常放大: {atr:.4f}"
    fields:
      atr: atr

  # === Volume (2) ===
  - name: 放量上涨
    category: volume
    subcategory: volume_surge
    direction: BUY
    strength: 55
    priority: medium
    cooldown: 1800
    condition:
      type: threshold_cross_up
      field: volume_ratio
      threshold: 2.0
    message_template: "放量上涨 量比:{vr:.2f}"
    fields:
      vr: volume_ratio

  - name: OBV上升
    category: volume
    subcategory: obv
    direction: BUY
    strength: 50
    priority: low
    cooldown: 3600
    condition:
      type: threshold_cross_up
      field: obv
      threshold: 0
    message_template: "OBV上升趋势"

  # === Pattern (4) ===
  - name: Doji出现
    category: pattern
    subcategory: candlestick
    direction: ALERT
    strength: 40
    priority: low
    cooldown: 1800
    condition:
      type: threshold_cross_up
      field: k_doji
      threshold: 0.5
    message_template: "Doji形态出现"

  - name: Hammer形态
    category: pattern
    subcategory: candlestick
    direction: BUY
    strength: 55
    priority: medium
    cooldown: 3600
    condition:
      type: threshold_cross_up
      field: k_hammer
      threshold: 0.5
    message_template: "Hammer形态出现"

  - name: ShootingStar
    category: pattern
    subcategory: candlestick
    direction: SELL
    strength: 55
    priority: medium
    cooldown: 3600
    condition:
      type: threshold_cross_up
      field: k_shooting_star
      threshold: 0.5
    message_template: "ShootingStar形态出现"

  - name: 看涨吞没
    category: pattern
    subcategory: candlestick
    direction: BUY
    strength: 65
    priority: high
    cooldown: 3600
    condition:
      type: threshold_cross_up
      field: k_engulfing_bull
      threshold: 0.5
    message_template: "看涨吞没形态"

thresholds:
  min_strength: 40

weights:
  momentum: 1.0
  trend: 1.2
  volatility: 0.8
  volume: 0.9
  pattern: 0.7
