# 新市场策略骨架 — 复制到 config/strategies/<market>_fast_5m.yaml
name: "TODO Market RSI 5m"
market: TODO_market          # 例: hk_stock / cn_stock
symbols:
  - TODO_SYMBOL_1
  - TODO_SYMBOL_2
timeframe: 5m

indicators:
  - name: rsi
    params:
      period: 14

rules:
  - name: RSI超卖反弹买入
    category: momentum
    subcategory: rsi
    direction: BUY
    strength: 62
    priority: high
    cooldown: 300
    min_volume: 0
    condition:
      type: threshold_cross_up
      field: rsi
      threshold: 35
    message_template: "RSI超卖反弹: {rsi:.1f}"
    fields:
      rsi: rsi

  - name: RSI超买回落卖出
    category: momentum
    subcategory: rsi
    direction: SELL
    strength: 62
    priority: high
    cooldown: 300
    min_volume: 0
    condition:
      type: threshold_cross_down
      field: rsi
      threshold: 65
    message_template: "RSI超买回落: {rsi:.1f}"
    fields:
      rsi: rsi

thresholds:
  min_strength: 50
  max_cooldown: 600
